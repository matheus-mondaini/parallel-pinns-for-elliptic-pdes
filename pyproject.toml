[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "parallel-pinns-elliptic-pdes"
dynamic = ["version"]
description = "PINN monolitica, DDP e XPINN para EDPs elipticas 2D (Laplace e Poisson): codigo do TCC."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Matheus Mondaini" }]
# Versoes com que os numeros do TCC foram gerados (ver README, "Plataforma")
dependencies = [
    "torch>=2.13",
    "numpy>=2.4",
    "scipy>=1.16",
    "psutil>=7.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
notebook = ["matplotlib>=3.10", "jupyter", "nbclient>=0.11"]
dev = ["pytest>=8"]

[project.scripts]
pinn-train-parallel = "parallel_pinns.cli.train_parallel:main"
pinn-run-task = "parallel_pinns.cli.run_task:main"
pinn-run-experiment = "parallel_pinns.cli.run_experiment:main"

# Ambiente travado (uv.lock): PyTorch com CUDA 13.2, o mesmo dos resultados, em Windows e Linux
[tool.uv]
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]
# Versoes exatas com que os resultados foram gerados (so restringem o lock; o pacote aceita as faixas acima)
constraint-dependencies = ["torch==2.13.0", "numpy==2.4.6", "scipy==1.16.3", "psutil==7.2.2", "pyyaml==6.0.3",
                           "matplotlib==3.10.9", "nbclient==0.11.0"]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu132" }]

[tool.hatch.version]
path = "src/parallel_pinns/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/parallel_pinns"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not lento'"
markers = ["lento: regressao com o orcamento completo (minutos por caso); rodar com `pytest -m lento`"]
filterwarnings = ["ignore::UserWarning"]
